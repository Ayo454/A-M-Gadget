<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0f">
  <title>Your Account | A&amp;M Gadget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="announcement">
    <p>Delivery fees are based on your destination.</p>
    <button aria-label="Close announcement">&times;</button>
  </div>
  <header class="header">
    <a class="brand" href="index.html" aria-label="A&amp;M Gadget home">
      <span class="brand-mark">A&amp;M</span>
      <span>A&amp;M Gadget</span>
    </a>
    <nav class="nav" aria-label="Main navigation">
      <a href="index.html#shop">Shop</a>
      <a href="index.html#categories">Categories</a>
      <a href="index.html#products">New arrivals</a>
      <a href="index.html#offers">Offers</a>
    </nav>
    <div class="header-actions">
      <a class="icon-button" href="index.html#products" aria-label="Search products">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg>
      </a>
      <a class="icon-button" href="index.html#products" aria-label="Continue shopping">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 8.5h15l-1 12h-13z"></path><path d="M8.5 9V6.5a3.5 3.5 0 0 1 7 0V9"></path></svg>
      </a>
      <button class="icon-button account-button" type="button" aria-label="Account" aria-expanded="false">
        <svg class="account-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"></circle><path d="M4.5 21a7.5 7.5 0 0 1 15 0"></path></svg>
        <img class="account-avatar-icon" alt="" hidden>
      </button>
      <button class="menu-button" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span>
      </button>
    </div>
  </header>

  <main class="form-page">
    <section class="form-card">
      <p class="eyebrow dark"><span></span> Your account</p>
      <h1>Welcome to A&amp;M Gadget</h1>
      <p class="form-intro">Create an account or sign in to your customer account.</p>
      <p class="form-status" id="accountStatus" role="status" aria-live="polite"></p>

      <div id="accountContent">
        <div class="form-tabs" role="tablist" aria-label="Account options">
          <button class="form-tab active" id="showLogin" type="button" role="tab" aria-selected="true">Sign in</button>
          <button class="form-tab" id="showRegister" type="button" role="tab" aria-selected="false">Create account</button>
        </div>

        <form id="loginForm" class="site-form">
          <label>Email address<input name="email" type="email" autocomplete="email" required maxlength="254"></label>
          <label>Password<input name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="128"></label>
          <button class="button button-primary" type="submit">Sign in <span>→</span></button>
        </form>

        <form id="registerForm" class="site-form" hidden>
          <label>Full name<input name="name" type="text" autocomplete="name" required maxlength="80"></label>
          <label>Email address<input name="email" type="email" autocomplete="email" required maxlength="254"></label>
          <label>Phone number<input name="phone" type="tel" autocomplete="tel" required minlength="7" maxlength="30" placeholder="+1 555 123 4567"></label>
          <label>Delivery address<textarea name="address" autocomplete="street-address" required minlength="5" maxlength="300" rows="3"></textarea></label>
          <label>Password<input name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="128"></label>
          <label>Profile photo (optional)<input id="profileImage" name="avatar" type="file" accept="image/png,image/jpeg,image/webp" aria-describedby="imageHelp"></label>
          <p class="form-help" id="imageHelp">PNG, JPG, or WebP; maximum file size 2 MB.</p>
          <img class="avatar-preview" id="avatarPreview" alt="Profile photo preview" hidden>
          <button class="button button-primary" type="submit">Create account <span>→</span></button>
        </form>
      </div>
    </section>
  </main>

  <footer>
    <a class="brand" href="index.html"><span class="brand-mark">A&amp;M</span><span>A&amp;M Gadget</span></a>
    <p>Technology with purpose.</p>
  </footer>
  <script src="account.js"></script>
  <script src="customer-nav.js"></script>
</body>
</html>
